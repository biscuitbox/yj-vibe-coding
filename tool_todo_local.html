<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#5B3DF5">
<title>오늘 할 일 · 내 컴퓨터에만 저장</title>
<style>
  :root{--accent:#5B3DF5;--accent-dark:#4A2FD6;--ink:#171A2E;--muted:#62648A;
        --line:#DCDCE8;--bg:#F3F3F8;--done:#9A9CBC}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    display:flex;flex-direction:column;align-items:center;padding:20px 14px 70px}
  .app{width:100%;max-width:520px}
  header{margin-bottom:18px}
  h1{font-size:27px;margin:0 0 2px}
  .date{color:var(--muted);font-size:15px;margin:0}
  .progress{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}
  .ptop{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .ptop b{font-size:25px}
  .ptop span{color:var(--muted);font-size:14px}
  .bar{height:12px;border-radius:6px;background:#E4E4EF;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s ease}
  form{display:flex;gap:8px;margin-bottom:14px}
  input[type=text]{flex:1;padding:13px 14px;font-size:16px;border:1px solid var(--line);
    border-radius:10px;font-family:inherit;background:#fff}
  input[type=text]:focus{outline:2px solid var(--accent);outline-offset:-1px}
  button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:0 20px;
    font-size:16px;cursor:pointer;font-family:inherit}
  button:hover{background:var(--accent-dark)}
  ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  li{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);
    border-radius:11px;padding:13px 14px}
  li .chk{width:24px;height:24px;flex:none;border:2px solid var(--line);border-radius:7px;
    background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;
    font-size:15px;color:#fff;padding:0}
  li.done .chk{background:var(--accent);border-color:var(--accent)}
  li .txt{flex:1;font-size:16px;word-break:break-all;line-height:1.5}
  li.done .txt{color:var(--done);text-decoration:line-through}
  li .del{background:none;color:var(--muted);font-size:19px;padding:0 4px;line-height:1}
  li .del:hover{background:none;color:#D9435A}
  .empty{background:#fff;border:1px dashed var(--line);border-radius:12px;padding:34px 18px;
    text-align:center;color:var(--muted);line-height:1.7}
  .tools{display:flex;justify-content:space-between;align-items:center;margin-top:16px;
    color:var(--muted);font-size:14px}
  .tools button{background:none;color:var(--muted);font-size:14px;padding:6px 10px;
    border:1px solid var(--line);border-radius:8px}
  .tools button:hover{background:#F0EFF9;color:var(--ink)}
  .note{background:#fff8e8;border:1px solid #f0dcb0;border-radius:11px;padding:13px 15px;
    margin-top:22px;font-size:14px;line-height:1.7;color:#6b4e12}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  nav :focus-visible{outline-color:#FFD400}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>오늘 할 일</h1>
    <p class="date" id="date"></p>
  </header>

  <div class="progress">
    <div class="ptop"><b id="ratio">0 / 0</b><span id="cheer">할 일을 적어 보세요</span></div>
    <div class="bar"><i id="fill"></i></div>
  </div>

  <form id="f">
    <input type="text" id="input" placeholder="무엇을 할까요?" maxlength="60" autocomplete="off">
    <button type="submit">추가</button>
  </form>

  <ul id="list"></ul>
  <div class="empty" id="empty">아직 비어 있습니다.<br>위에 할 일을 적고 추가를 눌러 보세요.</div>

  <div class="tools">
    <span id="count"></span>
    <button id="clear">완료한 것 치우기</button>
  </div>

  <div class="note">
    <b>이 목록은 지금 쓰는 브라우저에만 저장됩니다.</b><br>
    다른 컴퓨터나 휴대폰에서 열면 비어 있습니다. 어디서든 보이게 하려면 로그인과 클라우드 저장이 필요합니다 — 5차시에 만듭니다.
  </div>
</div>

<script>
/* ===== 저장: localStorage = 이 브라우저에만 남는 저장소 ===== */
const KEY = 'todo_local_v1';
let items = [];

function load(){
  try { items = JSON.parse(localStorage.getItem(KEY) || '[]'); }
  catch (e) { items = []; }
  if (!Array.isArray(items)) items = [];
}
function save(){
  localStorage.setItem(KEY, JSON.stringify(items));
}

/* ===== 화면 ===== */
const el = function(id){ return document.getElementById(id); };

function today(){
  const d = new Date();
  const days = ['일','월','화','수','목','금','토'];
  return d.getFullYear() + '년 ' + (d.getMonth()+1) + '월 ' + d.getDate() + '일 ' + days[d.getDay()] + '요일';
}

function render(){
  const list = el('list');
  list.innerHTML = '';
  items.forEach(function(it){
    const li = document.createElement('li');
    if (it.done) li.className = 'done';

    const chk = document.createElement('button');
    chk.className = 'chk';
    chk.textContent = it.done ? '✓' : '';
    chk.setAttribute('aria-label', it.done ? '완료 취소' : '완료로 표시');
    chk.addEventListener('click', function(){
      it.done = !it.done; save(); render();
    });

    const txt = document.createElement('span');
    txt.className = 'txt';
    txt.textContent = it.text;

    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = '×';
    del.setAttribute('aria-label', '삭제');
    del.addEventListener('click', function(){
      items = items.filter(function(x){ return x.id !== it.id; });
      save(); render();
    });

    li.append(chk, txt, del);
    list.appendChild(li);
  });

  const total = items.length;
  const done = items.filter(function(x){ return x.done; }).length;
  el('empty').style.display = total ? 'none' : 'block';
  el('ratio').textContent = done + ' / ' + total;
  el('fill').style.width = total ? (done / total * 100) + '%' : '0%';
  el('count').textContent = total ? ('남은 일 ' + (total - done) + '개') : '';
  el('cheer').textContent =
    total === 0 ? '할 일을 적어 보세요' :
    done === total ? '오늘 할 일을 다 했어요' :
    done === 0 ? '하나만 먼저 해 볼까요' : '잘하고 있어요';
}

el('f').addEventListener('submit', function(e){
  e.preventDefault();
  const v = el('input').value.trim();
  if (!v) return;
  items.push({ id: Date.now() + '_' + Math.random().toString(36).slice(2,7), text: v, done: false });
  el('input').value = '';
  save(); render();
});

el('clear').addEventListener('click', function(){
  items = items.filter(function(x){ return !x.done; });
  save(); render();
});

el('date').textContent = today();
load();
render();
</script>
</body>
</html>
